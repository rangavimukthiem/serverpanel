<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EKAFY Login</title>
  <script>
    (() => {
      try {
        const supported = ['system', 'dark', 'light', 'pearl', 'sepia', 'night-comfort', 'ocean', 'violet', 'forest', 'sunset'];
        const stored = localStorage.getItem('ekafy-theme');
        const preference = supported.includes(stored) ? stored : 'system';
        const theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
      } catch (_) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>

<body class="auth-page">
  <div id="globalMessageBar" class="global-message-bar" role="status" aria-live="polite" hidden>
    <span class="global-message-text"></span>
    <button type="button" class="global-message-close" aria-label="Dismiss message">&times;</button>
  </div>
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="brand-row">
        <div class="brand-mark">E</div>
        <div>
          <h1>EKAFY</h1>
          <p>VPS control panel</p>
        </div>
      </div>

      <form id="loginForm" class="form-stack">
        <label>
          Username
          <input id="username" name="username" type="text" autocomplete="username" required minlength="3">
        </label>

        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
        </label>

        <button type="submit">Sign in</button>
        <p id="authMessage" class="message" role="status"></p>
      </form>
      <div id="googleAuthSection" class="oauth-section">
        <div class="oauth-divider"><span>or</span></div>
        <a id="googleAuthButton" class="oauth-google-button" href="/api/auth/google" aria-disabled="true">
          <span class="oauth-google-mark" aria-hidden="true">G</span>
          Continue with Google
        </a>
        <p id="googleAuthMessage" class="message oauth-message" role="status">Checking Google sign-in availability...</p>
      </div>
    </section>
  </main>

  <script type="module" src="/js/pages/login.js"></script>
</body>

</html>
