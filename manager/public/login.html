<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKAFY Server Manager - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 2rem;
      justify-content: center;
    }
    .tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-md);
      padding: 0.3rem;
      margin-bottom: 1.75rem;
      gap: 0.25rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #041324;
      box-shadow: 0 2px 8px var(--primary-glow);
    }
    .error-box {
      background: var(--danger-bg);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--danger);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">E</div>
      <div>
        <div class="brand-title">EKAFY</div>
        <div class="brand-subtitle">Server Manager</div>
      </div>
    </div>

    <div class="tabs" id="auth-tabs">
      <button type="button" class="tab-btn active" id="tab-login-btn">Sign In</button>
      <button type="button" class="tab-btn" id="tab-register-btn">Setup Admin</button>
    </div>

    <div class="error-box" id="auth-error"></div>

    <!-- Sign In Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-identifier">Username or Email</label>
        <input type="text" id="login-identifier" class="form-input" placeholder="admin or email@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="login-submit-btn">
        Sign In to Dashboard
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="display: none;">
      <div class="form-group">
        <label class="form-label" for="reg-username">Admin Username</label>
        <input type="text" id="reg-username" class="form-input" placeholder="admin" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address</label>
        <input type="email" id="reg-email" class="form-input" placeholder="admin@ekafy.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Create a strong password" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="reg-submit-btn">
        Create Administrator Account
      </button>
    </form>
  </div>

  <script>
    const errorBox = document.getElementById('auth-error');
    const loginForm = document.getElementById('login-form');
    const regForm = document.getElementById('register-form');
    const tabLoginBtn = document.getElementById('tab-login-btn');
    const tabRegBtn = document.getElementById('tab-register-btn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.style.display = 'none';
    }

    // Check initial auth status to see if setup is required
    async function checkStatus() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (data.success && !data.hasAdmin) {
          // If no admin exists, switch directly to setup tab
          tabRegBtn.click();
          showError('No administrator found. Please create your primary admin account.');
          errorBox.style.background = 'rgba(56, 189, 248, 0.12)';
          errorBox.style.color = '#38bdf8';
          errorBox.style.borderColor = 'rgba(56, 189, 248, 0.3)';
        }
      } catch (_) {}
    }

    tabLoginBtn.addEventListener('click', () => {
      clearError();
      tabLoginBtn.classList.add('active');
      tabRegBtn.classList.remove('active');
      loginForm.style.display = 'block';
      regForm.style.display = 'none';
    });

    tabRegBtn.addEventListener('click', () => {
      clearError();
      tabRegBtn.classList.add('active');
      tabLoginBtn.classList.remove('active');
      regForm.style.display = 'block';
      loginForm.style.display = 'none';
    });

    // Login Form Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem('ekafy_token', data.token);
          localStorage.setItem('ekafy_user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          showError(data.error || 'Invalid credentials.');
        }
      } catch (err) {
        showError('Network error connecting to Server Manager API.');
      }
    });

    // Register Form Submit
    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem('ekafy_token', data.token);
          localStorage.setItem('ekafy_user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          showError(data.error || 'Failed to create admin account.');
        }
      } catch (err) {
        showError('Network error while registering account.');
      }
    });

    checkStatus();
  </script>
</body>
</html>
